[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # RUSTSEC-2023-0071 — Marvin timing sidechannel in the `rsa` crate, pulled in
  # transitively by `openidconnect` for RS256 ID-token verification. The attack
  # requires an attacker to observe decryption/signing timing with a private key.
  # The admin Lambda only VERIFIES the OIDC provider's ID-token signature with a
  # public key from the provider's JWKS — it holds no RSA private key and performs
  # no RSA decryption — so the vulnerable code path is not exercised. No fixed
  # `rsa` release exists yet; revisit when one ships or openidconnect drops it.
  { id = "RUSTSEC-2023-0071", reason = "verify-only OIDC path; no RSA private key held (ADR-0016)" },
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# `ring` reached the workspace tree only via crates/harness's `rustls-tls`
# reqwest feature (the provider-bundling one), which pulled hyper-rustls/ring
# -> rustls/ring. Switching harness to `rustls-tls-webpki-roots-no-provider`
# (matching crates/admin) plus installing the aws-lc-rs provider removed it —
# `cargo tree --workspace -i ring` prints nothing. No `wrappers` entry: a list
# that passed would have to name `rustls`, which is the crate that wanted
# `ring` in the first place, so it would permit exactly what this rule exists
# to forbid (issue #71, closes #74).
deny = [
  { name = "ring" },
  { name = "openssl" },
  { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
