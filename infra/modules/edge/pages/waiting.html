<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're in line</title>
    <link rel="stylesheet" href="/_wr/waiting.css" />
    <noscript>
      <!-- Without the script nothing joins or polls, so the copy promising
           an automatic let-through would be false. Hide it; the notice in
           the body replaces it. -->
      <style>
        .head,
        #note {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <main class="room">
      <header class="head">
        <p class="eyebrow">Virtual Waiting Room</p>
        <h1 id="headline">Getting your place in line…</h1>
        <p class="sub" id="subhead">
          Keep this page open. You'll be let through automatically.
        </p>
      </header>

      <div class="bar" id="bar" hidden>
        <div class="fill" id="fill">
          <span class="marker" aria-hidden="true">🏃</span>
        </div>
      </div>

      <dl class="card" id="stats" hidden>
        <div class="stat">
          <dt class="label">Your number in line</dt>
          <dd class="value" id="position">—</dd>
        </div>
        <div class="stat">
          <dt class="label">People ahead of you</dt>
          <dd class="value" id="ahead">—</dd>
        </div>
        <div class="stat">
          <dt class="label">Now serving</dt>
          <dd class="value" id="serving">—</dd>
        </div>
        <div class="stat">
          <dt class="label">Estimated wait</dt>
          <dd class="value" id="eta">—</dd>
        </div>
      </dl>

      <p class="updated" id="updated" hidden>
        <span class="pulse" aria-hidden="true"></span>
        Status last updated: <span id="updated-at">—</span>
      </p>

      <p class="broadcast" id="broadcast" hidden></p>

      <p class="note" id="note">
        Closing this page keeps your place — reopening it picks the same place
        back up.
      </p>

      <noscript>
        <p class="note error">
          You are not in line yet. Join below: it works without JavaScript,
          on a page that refreshes itself while you wait.
        </p>
        <form method="post" action="/v1/enter">
          <button type="submit">Join the line</button>
        </form>
      </noscript>

      <!-- Shown by the script tag's onerror: JavaScript is on, but the
           waiting room's own script did not load. -->
      <form id="nojs-join" method="post" action="/v1/enter" hidden>
        <button type="submit">Join the line without the script</button>
      </form>
    </main>

    <!-- A script that is blocked or fails to download would otherwise leave
         "Getting your place in line…" on screen forever with no join sent. -->
    <script
      src="/_wr/waiting.js"
      onerror="document.getElementById('headline').textContent='You are not in line yet';document.getElementById('subhead').textContent='This page could not load the script that takes your place in line. Reload to try again, or join below without it.';document.getElementById('note').hidden=true;document.getElementById('nojs-join').hidden=false"
    ></script>
  </body>
</html>
