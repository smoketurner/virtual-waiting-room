<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're in line</title>
    <link rel="stylesheet" href="/_wr/waiting.css" />
  </head>
  <body>
    <main class="room">
      <header class="head">
        <p class="eyebrow">Virtual Waiting Room</p>
        <h1 id="headline">Getting your place in line…</h1>
        <p class="sub" id="subhead">
          Keep this page open. You'll be let through automatically.
        </p>
      </header>

      <div class="bar" id="bar" hidden>
        <div class="fill" id="fill">
          <svg class="marker" viewBox="0 0 10 16" aria-hidden="true" focusable="false">
            <circle cx="5.6" cy="2.2" r="1.9" />
            <path d="M5.6 4.6 3.2 8.1l1.5 1.1-1.9 5.3 1.7.6 1.8-4.9 1.4 1.5.9 3.6 1.7-.4-1-4.2-1.6-1.8.8-2.5 1.6 1.9 1.4-1.1-2.5-3z" />
          </svg>
        </div>
      </div>

      <section class="card" id="stats" hidden>
        <div class="stat">
          <div class="label">Your position</div>
          <div class="value" id="position">—</div>
        </div>
        <div class="stat">
          <div class="label">Now serving</div>
          <div class="value" id="serving">—</div>
        </div>
        <div class="stat">
          <div class="label">Ahead of you</div>
          <div class="value" id="ahead">—</div>
        </div>
        <div class="stat">
          <div class="label">Estimated wait</div>
          <div class="value" id="eta">—</div>
        </div>
      </section>

      <p class="updated" id="updated" hidden>
        <span class="pulse" aria-hidden="true"></span>
        Status last updated: <span id="updated-at">—</span>
      </p>

      <p class="broadcast" id="broadcast" hidden></p>

      <p class="note" id="note">
        Closing this page keeps your place — reopening it picks the same place
        back up.
      </p>

      <noscript>
        <p class="note error">
          This waiting room needs JavaScript to hold your place in line and let
          you through when it's your turn.
        </p>
      </noscript>
    </main>

    <script src="/_wr/waiting.js"></script>
  </body>
</html>
