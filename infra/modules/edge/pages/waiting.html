<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>You're in line</title>
    <link rel="stylesheet" href="/_wr/waiting.css" />
  </head>
  <body>
    <main class="room">
      <header class="head">
        <p class="eyebrow">Virtual Waiting Room</p>
        <h1 id="headline">Getting your place in line…</h1>
        <p class="sub" id="subhead">
          Keep this page open. You'll be let through automatically.
        </p>
      </header>

      <div class="bar" id="bar" hidden>
        <div class="fill" id="fill">
          <span class="marker" aria-hidden="true">🏃</span>
        </div>
      </div>

      <dl class="card" id="stats" hidden>
        <div class="stat">
          <dt class="label">Your number in line</dt>
          <dd class="value" id="position">—</dd>
        </div>
        <div class="stat">
          <dt class="label">People ahead of you</dt>
          <dd class="value" id="ahead">—</dd>
        </div>
        <div class="stat">
          <dt class="label">Now serving</dt>
          <dd class="value" id="serving">—</dd>
        </div>
        <div class="stat">
          <dt class="label">Estimated wait</dt>
          <dd class="value" id="eta">—</dd>
        </div>
      </dl>

      <p class="updated" id="updated" hidden>
        <span class="pulse" aria-hidden="true"></span>
        Status last updated: <span id="updated-at">—</span>
      </p>

      <p class="broadcast" id="broadcast" hidden></p>

      <p class="note" id="note">
        Closing this page keeps your place — reopening it picks the same place
        back up.
      </p>

      <noscript>
        <p class="note error">
          This waiting room needs JavaScript to hold your place in line and let
          you through when it's your turn.
        </p>
      </noscript>
    </main>

    <script src="/_wr/waiting.js"></script>
  </body>
</html>
