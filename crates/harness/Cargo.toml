[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "harness"
path = "src/bin/load/main.rs"

[[bin]]
name = "stack"
path = "src/bin/stack/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
assign_position = { workspace = true }
aws-config = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
aws-sdk-ssm = { workspace = true, features = ["behavior-version-latest", "default-https-client", "rt-tokio"] }
axum = { workspace = true, features = ["http1", "tokio"] }
base64 = { workspace = true, features = ["std"] }
controller = { workspace = true }
generate_token = { workspace = true }
jiff = { workspace = true, features = ["std"] }
open_event = { workspace = true }
read = { workspace = true }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots-no-provider", "http2"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync", "process", "net", "io-util", "fs"] }
wr-common = { workspace = true }

[dev-dependencies]
# Paused virtual time for the end-to-end poll-count comparison test: it drives
# real run()/Edge traffic through several simulated minutes in milliseconds of
# wall clock, instead of sleeping for real.
tokio = { workspace = true, features = ["test-util"] }

[lints.clippy]
# The measurements are this tool's whole output and they are read by a person at
# a terminal, not shipped to a log aggregator. Everything else in the workspace
# denies stdout because it runs in Lambda, where an unstructured line is noise.
print_stdout = "allow"
