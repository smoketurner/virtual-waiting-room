[package]
name = "harness"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "harness"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["json", "rustls-tls-webpki-roots-no-provider", "http2"] }
rustls = { workspace = true, features = ["aws_lc_rs", "std", "tls12"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }

[dev-dependencies]
# Paused virtual time for the end-to-end poll-count comparison test: it drives
# real run()/Edge traffic through several simulated minutes in milliseconds of
# wall clock, instead of sleeping for real.
tokio = { workspace = true, features = ["test-util"] }

[lints.clippy]
# The measurements are this tool's whole output and they are read by a person at
# a terminal, not shipped to a log aggregator. Everything else in the workspace
# denies stdout because it runs in Lambda, where an unstructured line is noise.
print_stdout = "allow"
