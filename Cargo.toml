[workspace]
resolver = "3"
members = [
    "crates/admin",
    "crates/assign_position",
    "crates/authorizer",
    "crates/controller",
    "crates/generate_token",
    "crates/read",
    "crates/seal_event",
    "crates/wr-common",
]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/smoketurner/virtual-waiting-room"

[workspace.dependencies]
anyhow = { version = "=1.0.104", default-features = false }
askama = { version = "=0.16.1", default-features = false }
aws-config = { version = "=1.12.0", default-features = false }
# Experimental preview SDK (aws/aws-durable-execution-sdk-rust): the API may
# change without notice, so the pin is exact and upgrades are deliberate.
aws-durable-execution-sdk = { version = "=0.1.0", default-features = false }
aws-lc-rs = { version = "=1.18.1", default-features = false }
aws-sdk-dynamodb = { version = "=1.124.0", default-features = false }
aws-sdk-ssm = { version = "=1.122.0", default-features = false }
aws-smithy-types = { version = "=1.6.3", default-features = false }
aws_lambda_events = { version = "=1.2.0", default-features = false }
axum = { version = "=0.8.9", default-features = false }
base64 = { version = "=0.23.1", default-features = false }
cookie = { version = "=0.18.2", default-features = false }
jsonwebtoken = { version = "=11.0.0", default-features = false }
lambda_http = { version = "=1.3.1", default-features = false }
lambda_runtime = { version = "=1.4.0", default-features = false }
mime_guess = { version = "=2.0.5", default-features = false }
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest"] }
proptest = { version = "=1.11.0", default-features = false }
reqwest = { version = "=0.12.28", default-features = false }
rust-embed = { version = "=8.12.0", default-features = false }
rustls = { version = "=0.23.44", default-features = false }
serde = { version = "=1.0.229", default-features = false }
serde_dynamo = { version = "=4.3.0", default-features = false }
serde_json = { version = "=1.0.151", default-features = false }
thiserror = { version = "=2.0.20", default-features = false }
tokio = { version = "=1.53.1", default-features = false }
tower = { version = "=0.5.3", default-features = false }
tower-http = { version = "=0.7.1", default-features = false }
tracing = { version = "=0.1.44", default-features = false }
tracing-subscriber = { version = "=0.3.23", default-features = false }
wr-common = { path = "crates/wr-common", version = "=0.1.0" }

[workspace.lints.clippy]
allow_attributes = "deny"
await_holding_lock = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "warn"
large_futures = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
panic = "deny"
panic_in_result_fn = "deny"
pedantic = { level = "warn", priority = -1 }
print_stderr = "deny"
print_stdout = "deny"
similar_names = "allow"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
