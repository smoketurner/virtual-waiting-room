name: Client CI

on:
  push:
    branches: [main]
    paths:
      [
        "infra/modules/edge/pages/**",
        "infra/modules/edge/functions/**",
        "infra/modules/edge/tests/**",
        "crates/wr-common/tests/vectors/**",
        ".github/workflows/client-ci.yml",
      ]
  pull_request:
    paths:
      [
        "infra/modules/edge/pages/**",
        "infra/modules/edge/functions/**",
        "infra/modules/edge/tests/**",
        "crates/wr-common/tests/vectors/**",
        ".github/workflows/client-ci.yml",
      ]

permissions: {}

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.1"
      # Name the files rather than the directory, as the pre-commit hook does:
      # Node 20, the local floor, loads a bare directory as a module and fails.
      - run: node --test infra/modules/edge/tests/*.test.js
