name: Client CI

on:
  push:
    branches: [main]
    paths: ["infra/modules/edge/pages/**", "infra/modules/edge/tests/**", ".github/workflows/client-ci.yml"]
  pull_request:
    paths: ["infra/modules/edge/pages/**", "infra/modules/edge/tests/**", ".github/workflows/client-ci.yml"]

permissions: {}

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - run: node --test infra/modules/edge/tests
